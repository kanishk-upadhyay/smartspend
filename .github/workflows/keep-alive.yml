name: Keep-Alive (Prevent Supabase & Replit Sleep)

on:
  schedule:
    # Runs at 06:00 UTC every 3 days (well within Supabase's 7-day auto-pause limit)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  ping:
    name: Ping Services
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database & Auth
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://latthvnafxgfoiqhgyzq.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhdHRodm5hZnhnZm9pcWhneXpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxNTI5MzYsImV4cCI6MjA5ODcyODkzNn0.NgwKnIxp_QjJFRm39x4Vgb6_38CleiwodxNPTDS3B4A' }}
        run: |
          echo "Pinging Supabase REST endpoint (queries PostgreSQL)..."
          REST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/expenses?limit=1")
          echo "Supabase REST API status: ${REST_STATUS}"

          echo "Pinging Supabase Auth..."
          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/auth/v1/health")
          echo "Supabase Auth status: ${AUTH_STATUS}"

          if [ "$REST_STATUS" -ne 200 ] || [ "$AUTH_STATUS" -ne 200 ]; then
            echo "::warning::Supabase returned non-200 status (REST: ${REST_STATUS}, Auth: ${AUTH_STATUS})"
          fi

      - name: Ping Replit Deployment
        run: |
          echo "Pinging Replit deployment..."
          REPLIT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://smartspend--invincible01.replit.app/health")
          echo "Replit health status: ${REPLIT_STATUS}"
